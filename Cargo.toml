[workspace]
members = [".", "predicate-authority-desktop"]
resolver = "2"

[package]
name = "predicate-authorityd"
version = "0.7.2"
edition = "2021"
description = "Rust-based sidecar daemon for Predicate Authority"
license = "MIT"
repository = "https://github.com/predicatesystems/predicate-authority"

[lib]
name = "predicate_authorityd"
path = "src/lib.rs"

[[bin]]
name = "predicate-authorityd"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (for control-plane)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Cryptography
jsonwebtoken = "9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
lru = "0.12"

# Pattern matching (for policy rules)
glob = "0.3"
regex = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Terminal UI
ratatui = "0.26"
crossterm = "0.27"

# Configuration
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
urlencoding = "2"

# Web UI (embedded static files)
rust-embed = "8"
mime_guess = "2"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1.3"

[[bench]]
name = "delegation_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
