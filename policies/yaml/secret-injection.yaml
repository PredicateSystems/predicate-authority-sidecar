# Secret Injection Policy
# Demonstrates policy-driven secret injection for API calls and CLI commands
# Secrets stay on the sidecar - agents never see raw credentials

rules:
  # === DENY RULES ===

  - name: deny-sensitive-endpoints-direct
    effect: deny
    principals: ["*"]
    actions:
      - http.fetch
      - http.get
      - http.post
    resources:
      - "*/internal/*"
      - "*/admin/*"
      - "*/private/*"

  # === API RULES WITH HEADER INJECTION ===

  - name: github-api-with-auth
    effect: allow
    principals: ["agent:*"]
    actions: ["http.fetch"]
    resources: ["https://api.github.com/*"]
    inject_headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
      Accept: "application/vnd.github.v3+json"
      X-GitHub-Api-Version: "2022-11-28"

  - name: openai-api-with-auth
    effect: allow
    principals: ["agent:*"]
    actions: ["http.fetch"]
    resources: ["https://api.openai.com/*"]
    inject_headers:
      Authorization: "Bearer ${OPENAI_API_KEY}"
      Content-Type: "application/json"

  - name: anthropic-api-with-auth
    effect: allow
    principals: ["agent:*"]
    actions: ["http.fetch"]
    resources: ["https://api.anthropic.com/*"]
    inject_headers:
      x-api-key: "${ANTHROPIC_API_KEY}"
      anthropic-version: "2023-06-01"
      Content-Type: "application/json"

  # === CLI RULES WITH ENV INJECTION ===

  - name: aws-cli-with-credentials
    effect: allow
    principals:
      - "agent:ops"
      - "agent:deployer"
    actions: ["cli.exec"]
    resources:
      - "aws"
      - "aws *"
    inject_env:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"

  - name: kubectl-with-config
    effect: allow
    principals:
      - "agent:ops"
      - "agent:deployer"
    actions: ["cli.exec"]
    resources:
      - "kubectl"
      - "kubectl *"
    inject_env:
      KUBECONFIG: "${KUBECONFIG:-/etc/kubernetes/admin.conf}"

  - name: database-cli-with-credentials
    effect: allow
    principals: ["agent:dba"]
    actions: ["cli.exec"]
    resources:
      - "psql"
      - "psql *"
      - "pg_dump"
      - "pg_dump *"
      - "mysql"
      - "mysql *"
    inject_env:
      PGPASSWORD: "${DB_PASSWORD}"
      PGHOST: "${DB_HOST:-localhost}"
      PGUSER: "${DB_USER:-postgres}"
      PGDATABASE: "${DB_NAME:-postgres}"

  - name: docker-registry-auth
    effect: allow
    principals: ["agent:builder"]
    actions: ["cli.exec"]
    resources:
      - "docker push*"
      - "docker pull*"
      - "docker login*"
    inject_env:
      DOCKER_USERNAME: "${DOCKER_USERNAME}"
      DOCKER_PASSWORD: "${DOCKER_PASSWORD}"
      DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.io}"

  # === SAFE CLI COMMANDS (no injection needed) ===

  - name: allow-safe-cli-commands
    effect: allow
    principals: ["agent:*"]
    actions: ["cli.exec"]
    resources:
      - "ls"
      - "ls *"
      - "cat *"
      - "head *"
      - "tail *"
      - "grep *"
      - "find *"
      - "pwd"
      - "whoami"
      - "date"
      - "echo *"

  # === DEFAULT DENY ===

  - name: default-deny
    effect: deny
    principals: ["*"]
    actions: ["*"]
    resources: ["*"]
